<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" />

  <!-- 连接图标 -->
  <g fill="white">
    <!-- 左侧设备 -->
    <rect x="40" y="70" width="40" height="60" rx="5" />
    <circle cx="60" cy="100" r="8" fill="#22c55e" />

    <!-- 连接线 -->
    <path d="M 80 100 L 100 100" stroke="white" stroke-width="3" stroke-dasharray="5,5" />
    <path d="M 100 100 L 120 100" stroke="white" stroke-width="3" stroke-dasharray="5,5" />

    <!-- 右侧设备 -->
    <rect x="120" y="80" width="30" height="40" rx="3" />
    <circle cx="135" cy="100" r="6" fill="#22c55e" />
  </g>

  <!-- 文字 -->
  <text x="100" y="160" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">
    LinkGate
  </text>
</svg>
